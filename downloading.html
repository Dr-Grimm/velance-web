<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloading Velance…</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #ffffff;
      --bg-card:   #f2f5fb;
      --bg-card-h: #e8edf8;
      --text:      #0a1628;
      --text-muted:#5e718a;
      --text-faint:#9aacbf;
      --border:    #dde4f0;
      --border-l:  #ecf0f8;
      --teal: #14b8a6;
      --sky:  #0ea5e9;
      --grad: linear-gradient(135deg, #14b8a6 0%, #0ea5e9 100%);
    }
    [data-theme="dark"] {
      --bg:        #060d18;
      --bg-card:   #0d1b2e;
      --bg-card-h: #12243d;
      --text:      #e8f0fa;
      --text-muted:#5e7a96;
      --text-faint:#3a5570;
      --border:    #172840;
      --border-l:  #102035;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 52px 44px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(10,22,40,.13), 0 8px 24px rgba(10,22,40,.07);
      position: relative;
      overflow: hidden;
    }
    [data-theme="dark"] .card {
      box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.38);
    }
    .card::before {
      content: '';
      position: absolute;
      width: 480px; height: 480px;
      top: -220px; left: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(14,165,233,.09) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Logo */
    .logo {
      width: 68px; height: 68px;
      border-radius: 18px;
      margin: 0 auto 28px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(14,165,233,.32);
      animation: float 4s ease-in-out infinite alternate;
      position: relative;
      z-index: 1;
    }
    .logo img { width: 100%; height: 100%; display: block; }
    @keyframes float {
      from { transform: translateY(0); }
      to   { transform: translateY(-7px); }
    }

    /* Progress bar */
    .progress {
      height: 4px;
      background: var(--border);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 30px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 100px;
      background: var(--grad);
      animation: sweep 1.8s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { transform: translateX(-100%) scaleX(.35); }
      50%  { transform: translateX(30%)   scaleX(.55); }
      100% { transform: translateX(220%)  scaleX(.35); }
    }
    .progress.done .progress-fill { animation: none; width: 100%; }

    .status {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.15;
    }
    .subtitle {
      font-size: .9rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.65;
    }

    /* Main download button */
    .dl-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 15px 24px;
      border-radius: 13px;
      background: var(--grad);
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(14,165,233,.38);
      transition: transform .15s, box-shadow .15s;
      margin-bottom: 10px;
    }
    .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(14,165,233,.5); }
    .dl-btn:active { transform: translateY(0); }
    .dl-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .hint {
      font-size: .76rem;
      color: var(--text-faint);
      margin-bottom: 28px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: .76rem;
      color: var(--text-faint);
      margin-bottom: 28px;
    }
    .meta-sep { color: var(--border); }

    hr {
      border: none;
      border-top: 1px solid var(--border-l);
      margin-bottom: 18px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: .8rem;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      transition: color .15s, background .15s;
    }
    .back:hover { color: var(--text); background: var(--bg-card-h); }
    .back svg { width: 13px; height: 13px; }

    @media (max-width: 500px) {
      .card { padding: 40px 22px 32px; }
      .status { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">
    <img src="/assets/logo.png" alt="Velance" />
  </div>

  <div class="progress" id="progress">
    <div class="progress-fill"></div>
  </div>

  <h1 class="status" id="status">Your download is starting…</h1>
  <p class="subtitle" id="subtitle">
    If it doesn't begin in a few seconds, click the button below.
  </p>

  <a href="/download" class="dl-btn" id="dl-btn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    Download Velance
  </a>
  <p class="hint">Free during beta &nbsp;·&nbsp; Windows 10 / 11</p>

  <p class="meta">
    <span id="meta-version">Latest release</span>
    <span class="meta-sep">·</span>
    <span id="meta-size">~105 MB</span>
  </p>

  <hr />

  <a href="/" class="back">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Back to velance.org
  </a>
</div>

<!-- Hidden iframe — triggers the Cloudflare worker which redirects to the .exe.
     Binary response with Content-Disposition:attachment starts the download
     without navigating away or requiring a user gesture. -->
<iframe id="dl-frame" src="/download" style="display:none;width:0;height:0;border:0"></iframe>

<script>
  // Apply saved theme
  const t = localStorage.getItem('velance-theme');
  if (t) document.documentElement.setAttribute('data-theme', t);

  const statusEl  = document.getElementById('status');
  const subEl     = document.getElementById('subtitle');
  const progressEl= document.getElementById('progress');
  const verEl     = document.getElementById('meta-version');
  const sizeEl    = document.getElementById('meta-size');

  // Update version display from GitHub API (best-effort, no auth needed for rate display)
  fetch('https://api.github.com/repos/Dr-Grimm/velance-app/releases/latest', {
    headers: { Accept: 'application/vnd.github+json' }
  })
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data) return;
    const asset = data.assets?.find(a => a.name.endsWith('.exe'));
    if (data.tag_name) verEl.textContent = data.tag_name;
    if (asset?.size)   sizeEl.textContent = (asset.size / 1024 / 1024).toFixed(1) + ' MB';
  })
  .catch(() => {});

  // After 3 seconds, show "download started" confirmation
  setTimeout(() => {
    progressEl.classList.add('done');
    statusEl.textContent  = 'Download started!';
    subEl.textContent     = 'Check your browser\'s download bar. Run the installer once it\'s done.';
  }, 3000);
</script>
</body>
</html>
